name: CI

on:
  push:
    branches: [build/fresh]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      APP_MODE: demo
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgres://alnamer_test:alnamer_test@localhost:5433/alnamer_test
      SMOKE_PORT: "3410"
      MAILPIT_URL: http://localhost:8025
    services:
      # The throwaway test database; same port and credentials as docker-compose.yml `db-test`.
      db-test:
        image: postgres:17-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: alnamer_test
          POSTGRES_PASSWORD: alnamer_test
          POSTGRES_DB: alnamer_test
        options: >-
          --health-cmd "pg_isready -U alnamer_test -d alnamer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build

      # Creates .env from .env.example with freshly generated secrets and a matching Redis token
      # (demo mode, mock providers, local service URLs). Nothing comes from repository secrets.
      - name: Create local .env
        run: npm run env:init

      # The Redis REST proxy needs the token generated above, so it starts here, not as a service.
      - name: Start Redis REST proxy
        run: |
          set -euo pipefail
          token="$(grep '^LOCAL_REDIS_TOKEN=' .env | cut -d= -f2-)"
          echo "::add-mask::$token"
          docker run -d --name redis-rest -p 8079:80 \
            --add-host host.docker.internal:host-gateway \
            -e SRH_MODE=env \
            -e SRH_TOKEN="$token" \
            -e SRH_CONNECTION_STRING=redis://host.docker.internal:6379 \
            hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8079/; then exit 0; fi
            sleep 1
          done
          docker logs redis-rest
          exit 1

      - run: npm run test:int

      - run: npx playwright install --with-deps chromium

      - run: npm run smoke
        env:
          SMOKE_SKIP_VISUAL: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
