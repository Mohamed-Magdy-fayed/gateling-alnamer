services:
  db:
    image: postgres:17-alpine
    container_name: alnamer_db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - alnamer_pgdata:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit
    container_name: alnamer_mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  alnamer_pgdata:
